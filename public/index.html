<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Piddicus: a menu of small browser projects.">
    <meta name="theme-color" content="#1d151c">
    <title>Piddicus</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <canvas class="backdrop__lava"></canvas>
        <div class="backdrop__petals"></div>
        <div class="backdrop__sparkle backdrop__sparkle--a"></div>
        <div class="backdrop__sparkle backdrop__sparkle--b"></div>
        <div class="backdrop__sparkle backdrop__sparkle--c"></div>
        <div class="backdrop__sparkle backdrop__sparkle--d"></div>
        <div class="backdrop__sparkle backdrop__sparkle--e"></div>
    </div>

    <header class="site-header">
        <a class="site-header__brand" href="./" aria-label="Piddicus home">
            <img class="site-header__logo" src="logo.svg" alt="Piddicus" width="968" height="348">
        </a>
        <nav class="site-header__nav" aria-label="Links">
            <a href="links/">Links</a>
            <a href="https://github.com/ProgrammingPaddy" target="_blank" rel="noopener">GitHub</a>
        </nav>
    </header>

    <main class="page">
        <section class="hero">
            <h1 class="hero__logo reveal">
                <span class="hero__logo-float">
                    <img src="logo.svg" alt="Piddicus" width="968" height="348">
                </span>
            </h1>
            <p class="hero__tagline reveal">
                <span class="hero__phrase" data-effect="enchant">Fun projects</span>
                <span class="hero__tagline-soft">and <span class="hero__phrase" data-effect="gears">helpful tools.</span></span>
            </p>
        </section>

        <section id="projects" class="menu" aria-label="Projects">
            <div class="menu__bar reveal">
                <div class="filter" id="filter" role="group" aria-label="Filter by category"></div>
                <p class="menu__count" id="project-count" aria-live="polite"></p>
            </div>

            <ul class="card-grid" id="project-grid" aria-busy="true"></ul>

            <p class="empty-state" id="empty-state" hidden>
                Nothing on the shelf yet. Drop a folder into
                <code>public/projects</code> to add one.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p class="site-footer__brand">
            <img class="site-footer__logo" src="logo.svg" alt="" width="968" height="348">
            <span>&copy; <span id="year"></span></span>
        </p>
        <p><a href="https://github.com/ProgrammingPaddy/piddicuscom" target="_blank" rel="noopener">Source</a></p>
    </footer>

    <template id="card-template">
        <li class="card">
            <a class="card__link" href="#">
                <div class="card__top">
                    <h2 class="card__title"></h2>
                    <span class="card__meta" aria-hidden="true">
                        <span class="card__index"></span>
                        <span class="card__arrow">&rarr;</span>
                    </span>
                </div>
                <p class="card__description"></p>
                <ul class="card__tags"></ul>
            </a>
        </li>
    </template>

    <script src="js/main.js" type="module"></script>
    <script src="js/logo.js" type="module"></script>
    <script src="js/tagline.js" type="module"></script>
    <script src="js/backdrop.js" type="module"></script>
</body>
</html>
