<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Piddicus: a menu of small browser projects.">
    <meta name="theme-color" content="#1d151c">
    <title>Piddicus</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/themes.css">

    <!-- Applies the saved theme before the first paint. -->
    <script src="js/theme.js"></script>
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <canvas class="backdrop__scene"></canvas>
        <div class="backdrop__petals"></div>
        <div class="backdrop__sparkle backdrop__sparkle--a"></div>
        <div class="backdrop__sparkle backdrop__sparkle--b"></div>
        <div class="backdrop__sparkle backdrop__sparkle--c"></div>
        <div class="backdrop__sparkle backdrop__sparkle--d"></div>
        <div class="backdrop__sparkle backdrop__sparkle--e"></div>
    </div>

    <header class="site-header">
        <a class="site-header__brand" href="./" aria-label="Piddicus home">
            <span class="site-header__logo logo-image"></span>
        </a>
        <div class="site-header__end">
            <nav class="site-header__nav" aria-label="Links">
                <a class="site-header__link" href="links/">Links</a>
            </nav>
            <details class="theme-picker">
                <summary class="site-header__link theme-picker__summary">Theme</summary>
                <div class="theme-picker__menu" role="menu" aria-label="Theme"></div>
            </details>
        </div>
    </header>

    <main class="page">
        <section class="hero">
            <h1 class="hero__logo reveal">
                <span class="hero__logo-float">
                    <span class="hero__logo-image logo-image" role="img" aria-label="Piddicus"></span>
                </span>
            </h1>
            <p class="hero__tagline reveal">
                <span class="hero__phrase" data-effect="enchant">Fun stuff</span>
                <span class="hero__tagline-soft">and <span class="hero__phrase" data-effect="gears">helpful tools.</span></span>
            </p>
        </section>

        <section id="projects" class="menu" aria-label="Projects">
            <div class="menu__bar reveal">
                <div class="filter" id="filter" role="group" aria-label="Filter by category"></div>
                <p class="menu__count" id="project-count" aria-live="polite"></p>
            </div>

            <ul class="card-grid" id="project-grid" aria-busy="true"></ul>

            <p class="empty-state" id="empty-state" hidden>
                Nothing on the shelf yet. Drop a folder into
                <code>public/projects</code> to add one.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p class="site-footer__brand">
            <span class="site-footer__logo logo-image"></span>
            <span>&copy; <span id="year"></span></span>
        </p>
        <p><a href="https://github.com/ProgrammingPaddy/piddicuscom" target="_blank" rel="noopener">Source</a></p>
    </footer>

    <template id="card-template">
        <li class="card">
            <a class="card__link" href="#">
                <figure class="card__preview"></figure>
                <h2 class="card__title"></h2>
                <ul class="card__tags"></ul>
            </a>
        </li>
    </template>

    <script src="js/main.js" type="module"></script>
    <script src="js/logo.js" type="module"></script>
    <script src="js/tagline.js" type="module"></script>
    <script src="js/backdrop.js" type="module"></script>
</body>
</html>
