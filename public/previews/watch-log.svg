<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A ranked list with ratings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--preview-bg-top, #2f2130)"/>
      <stop offset="1" stop-color="var(--preview-bg-bottom, #241a26)"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#bg)"/>

  <!-- Rank numbers -->
  <g font-family="Fredoka, Nunito, system-ui, sans-serif" font-size="10" font-weight="500" fill="var(--preview-muted, #977d8c)">
    <text x="24" y="38">1</text>
    <text x="24" y="72">2</text>
    <text x="24" y="106">3</text>
    <text x="24" y="140">4</text>
    <text x="24" y="174">5</text>
  </g>

  <!-- Titles, as bars of varying length -->
  <g fill="var(--preview-cream, #f7edf1)" opacity="0.85">
    <rect x="44" y="30" width="96" height="9" rx="4.5"/>
    <rect x="44" y="64" width="112" height="9" rx="4.5"/>
    <rect x="44" y="98" width="58" height="9" rx="4.5"/>
    <rect x="44" y="132" width="84" height="9" rx="4.5"/>
    <rect x="44" y="166" width="110" height="9" rx="4.5"/>
  </g>

  <!-- Rating bars: five per row, two points each, filled by fraction -->
  <g fill="var(--preview-accent, #fec6d9)">
    <g>
      <rect x="184" y="31" width="14" height="7" rx="3.5"/><rect x="201" y="31" width="14" height="7" rx="3.5"/><rect x="218" y="31" width="14" height="7" rx="3.5"/><rect x="235" y="31" width="14" height="7" rx="3.5"/><rect x="252" y="31" width="14" height="7" rx="3.5"/>
    </g>
    <g>
      <rect x="184" y="65" width="14" height="7" rx="3.5"/><rect x="201" y="65" width="14" height="7" rx="3.5"/><rect x="218" y="65" width="14" height="7" rx="3.5"/><rect x="235" y="65" width="14" height="7" rx="3.5"/><rect x="252" y="65" width="14" height="7" rx="3.5"/>
    </g>
    <g>
      <rect x="184" y="99" width="14" height="7" rx="3.5"/><rect x="201" y="99" width="14" height="7" rx="3.5"/><rect x="218" y="99" width="14" height="7" rx="3.5"/><rect x="235" y="99" width="14" height="7" rx="3.5"/>
      <rect x="252" y="99" width="14" height="7" rx="3.5" fill="var(--preview-panel, #3b2a3b)"/><rect x="252" y="99" width="10.5" height="7" rx="3.5"/>
    </g>
    <g>
      <rect x="184" y="133" width="14" height="7" rx="3.5"/><rect x="201" y="133" width="14" height="7" rx="3.5"/><rect x="218" y="133" width="14" height="7" rx="3.5"/><rect x="235" y="133" width="14" height="7" rx="3.5"/>
      <rect x="252" y="133" width="14" height="7" rx="3.5" fill="var(--preview-panel, #3b2a3b)"/><rect x="252" y="133" width="7" height="7" rx="3.5"/>
    </g>
    <g>
      <rect x="184" y="167" width="14" height="7" rx="3.5"/><rect x="201" y="167" width="14" height="7" rx="3.5"/><rect x="218" y="167" width="14" height="7" rx="3.5"/><rect x="235" y="167" width="14" height="7" rx="3.5"/>
      <rect x="252" y="167" width="14" height="7" rx="3.5" fill="var(--preview-panel, #3b2a3b)"/>
    </g>
  </g>
  <g font-family="Fredoka, Nunito, system-ui, sans-serif" font-size="10" font-weight="500" fill="var(--preview-cream, #f7edf1)" text-anchor="end">
    <text x="290" y="38">10</text>
    <text x="290" y="72">10</text>
    <text x="290" y="106">9.5</text>
    <text x="290" y="140">9</text>
    <text x="290" y="174">8</text>
  </g>

  <!-- Row dividers -->
  <g stroke="var(--preview-panel, #3b2a3b)" stroke-width="1">
    <line x1="20" y1="52" x2="304" y2="52"/>
    <line x1="20" y1="86" x2="304" y2="86"/>
    <line x1="20" y1="120" x2="304" y2="120"/>
    <line x1="20" y1="154" x2="304" y2="154"/>
  </g>
</svg>
