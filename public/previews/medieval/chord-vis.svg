<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A chord shown on a lute neck and a keyboard, engraved on a bronze plate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--preview-bg-top, #2a221a)"/>
      <stop offset="1" stop-color="var(--preview-bg-bottom, #1d1813)"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#bg)"/>

  <!-- Plate border with corner studs -->
  <rect x="7" y="7" width="306" height="186" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1" opacity="0.4"/>
  <g fill="var(--preview-accent, #d6a65a)" opacity="0.7">
    <rect x="4" y="4" width="6" height="6" transform="rotate(45 7 7)"/>
    <rect x="310" y="4" width="6" height="6" transform="rotate(45 313 7)"/>
    <rect x="4" y="190" width="6" height="6" transform="rotate(45 7 193)"/>
    <rect x="310" y="190" width="6" height="6" transform="rotate(45 313 193)"/>
  </g>

  <!-- Chord name on a parchment tag -->
  <path d="M24 16 H80 L86 27 L80 38 H24 Z" fill="var(--preview-cream, #eee2cb)"/>
  <text x="51" y="31" text-anchor="middle" font-family="Cinzel, 'Times New Roman', serif" font-size="12" font-weight="700" fill="var(--preview-ink, #1d1915)">Cmaj7</text>
  <text x="98" y="30" font-family="Cinzel, 'Times New Roman', serif" font-size="9.5" letter-spacing="0.6" fill="var(--preview-muted, #8b7c64)">I in C major</text>

  <!-- Lute neck -->
  <rect x="24" y="46" width="272" height="72" rx="3" fill="var(--preview-ramp-2, #8a6738)"/>
  <rect x="24" y="46" width="272" height="72" rx="3" fill="none" stroke="var(--preview-ink, #1d1915)" stroke-width="1" opacity="0.5"/>
  <rect x="24" y="46" width="6" height="72" fill="var(--preview-accent-strong, #ecc274)"/>
  <g stroke="var(--preview-accent-strong, #ecc274)" stroke-width="2">
    <line x1="92" y1="47" x2="92" y2="117"/>
    <line x1="160" y1="47" x2="160" y2="117"/>
    <line x1="228" y1="47" x2="228" y2="117"/>
  </g>
  <g stroke="var(--preview-cream, #eee2cb)" stroke-linecap="round" opacity="0.8">
    <line x1="30" y1="56" x2="296" y2="56" stroke-width="0.8"/>
    <line x1="30" y1="66" x2="296" y2="66" stroke-width="1"/>
    <line x1="30" y1="76" x2="296" y2="76" stroke-width="1.3"/>
    <line x1="30" y1="86" x2="296" y2="86" stroke-width="1.6"/>
    <line x1="30" y1="96" x2="296" y2="96" stroke-width="1.9"/>
    <line x1="30" y1="106" x2="296" y2="106" stroke-width="2.2"/>
  </g>
  <!-- Fingers: bronze studs -->
  <g fill="var(--preview-accent, #d6a65a)" stroke="var(--preview-ink, #1d1915)" stroke-width="1">
    <circle cx="61" cy="66" r="7"/>
    <circle cx="126" cy="86" r="7"/>
    <circle cx="194" cy="96" r="7"/>
  </g>
  <!-- Open and muted strings -->
  <g fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1.5">
    <circle cx="14" cy="56" r="3.5"/>
    <circle cx="14" cy="76" r="3.5"/>
  </g>
  <g stroke="var(--preview-muted, #8b7c64)" stroke-width="1.5" stroke-linecap="round">
    <line x1="11" y1="103" x2="17" y2="109"/>
    <line x1="17" y1="103" x2="11" y2="109"/>
  </g>

  <!-- Keyboard: ivory and ebony -->
  <rect x="24" y="132" width="272" height="54" rx="2" fill="var(--preview-panel, #393022)"/>
  <g fill="var(--preview-cream, #eee2cb)">
    <rect x="27" y="135" width="17" height="48" rx="1" fill="var(--preview-accent, #d6a65a)"/>
    <rect x="46" y="135" width="17" height="48" rx="1"/>
    <rect x="65" y="135" width="17" height="48" rx="1" fill="var(--preview-accent, #d6a65a)"/>
    <rect x="84" y="135" width="17" height="48" rx="1"/>
    <rect x="103" y="135" width="17" height="48" rx="1" fill="var(--preview-accent, #d6a65a)"/>
    <rect x="122" y="135" width="17" height="48" rx="1"/>
    <rect x="141" y="135" width="17" height="48" rx="1" fill="var(--preview-accent, #d6a65a)"/>
    <rect x="160" y="135" width="17" height="48" rx="1"/>
    <rect x="179" y="135" width="17" height="48" rx="1"/>
    <rect x="198" y="135" width="17" height="48" rx="1"/>
    <rect x="217" y="135" width="17" height="48" rx="1"/>
    <rect x="236" y="135" width="17" height="48" rx="1"/>
    <rect x="255" y="135" width="17" height="48" rx="1"/>
    <rect x="274" y="135" width="19" height="48" rx="1"/>
  </g>
  <g fill="var(--preview-ink, #1d1915)">
    <rect x="39" y="135" width="11" height="29" rx="1"/>
    <rect x="58" y="135" width="11" height="29" rx="1"/>
    <rect x="96" y="135" width="11" height="29" rx="1"/>
    <rect x="115" y="135" width="11" height="29" rx="1"/>
    <rect x="134" y="135" width="11" height="29" rx="1"/>
    <rect x="172" y="135" width="11" height="29" rx="1"/>
    <rect x="191" y="135" width="11" height="29" rx="1"/>
    <rect x="229" y="135" width="11" height="29" rx="1"/>
    <rect x="248" y="135" width="11" height="29" rx="1"/>
    <rect x="267" y="135" width="11" height="29" rx="1"/>
  </g>
</svg>
