<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A scribbled sheet and a quill beside a ledger page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--preview-bg-top, #2a221a)"/>
      <stop offset="1" stop-color="var(--preview-bg-bottom, #1d1813)"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#bg)"/>

  <!-- Plate border with corner studs -->
  <rect x="7" y="7" width="306" height="186" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1" opacity="0.4"/>
  <g fill="var(--preview-accent, #d6a65a)" opacity="0.7">
    <rect x="4" y="4" width="6" height="6" transform="rotate(45 7 7)"/>
    <rect x="310" y="4" width="6" height="6" transform="rotate(45 313 7)"/>
    <rect x="4" y="190" width="6" height="6" transform="rotate(45 7 193)"/>
    <rect x="310" y="190" width="6" height="6" transform="rotate(45 313 193)"/>
  </g>

  <!-- Loose sheet, a little askew, with scribbled lines -->
  <g transform="rotate(-4 80 100)">
    <rect x="22" y="34" width="118" height="132" fill="var(--preview-cream, #eee2cb)"/>
    <rect x="22" y="34" width="118" height="132" fill="none" stroke="var(--preview-ramp-2, #8a6738)" stroke-width="1" opacity="0.6"/>
    <g fill="var(--preview-ink, #1d1915)" opacity="0.7">
      <rect x="34" y="48" width="74" height="5" rx="1"/>
      <rect x="34" y="64" width="52" height="5" rx="1"/>
      <rect x="34" y="80" width="88" height="5" rx="1"/>
      <rect x="34" y="96" width="64" height="5" rx="1"/>
      <rect x="34" y="112" width="80" height="5" rx="1"/>
      <rect x="34" y="128" width="46" height="5" rx="1"/>
      <rect x="34" y="144" width="60" height="5" rx="1"/>
    </g>
  </g>

  <!-- Quill -->
  <path d="M96 176 C 118 150, 132 128, 156 104 C 150 126, 134 150, 108 172 Z" fill="var(--preview-accent, #d6a65a)"/>
  <path d="M96 176 C 118 150, 132 128, 156 104" fill="none" stroke="var(--preview-accent-strong, #ecc274)" stroke-width="1"/>
  <line x1="96" y1="176" x2="88" y2="184" stroke="var(--preview-ink, #1d1915)" stroke-width="2" stroke-linecap="round"/>

  <!-- Ledger page -->
  <path d="M182 34 H300 L298 166 H184 Z" fill="var(--preview-cream, #eee2cb)"/>
  <path d="M182 34 H300 L298 166 H184 Z" fill="none" stroke="var(--preview-ramp-2, #8a6738)" stroke-width="1" opacity="0.6"/>
  <g stroke="var(--preview-ramp-2, #8a6738)" stroke-width="0.8" opacity="0.4">
    <line x1="188" y1="56" x2="294" y2="56"/>
    <line x1="188" y1="78" x2="294" y2="78"/>
    <line x1="188" y1="100" x2="294" y2="100"/>
    <line x1="188" y1="122" x2="294" y2="122"/>
    <line x1="188" y1="144" x2="294" y2="144"/>
  </g>
  <g fill="var(--preview-ink, #1d1915)" opacity="0.75">
    <rect x="192" y="43" width="42" height="5" rx="1"/>
    <rect x="192" y="65" width="30" height="5" rx="1"/>
    <rect x="192" y="87" width="50" height="5" rx="1"/>
    <rect x="192" y="109" width="36" height="5" rx="1"/>
    <rect x="192" y="131" width="46" height="5" rx="1"/>
    <rect x="192" y="153" width="26" height="5" rx="1"/>
  </g>
  <!-- Ratings: three studs per row -->
  <g fill="var(--preview-accent, #d6a65a)">
    <g><rect x="258" y="42" width="7" height="7" transform="rotate(45 261.5 45.5)"/><rect x="271" y="42" width="7" height="7" transform="rotate(45 274.5 45.5)"/><rect x="284" y="42" width="7" height="7" transform="rotate(45 287.5 45.5)"/></g>
    <g><rect x="258" y="64" width="7" height="7" transform="rotate(45 261.5 67.5)"/><rect x="271" y="64" width="7" height="7" transform="rotate(45 274.5 67.5)"/><rect x="284" y="64" width="7" height="7" transform="rotate(45 287.5 67.5)"/></g>
    <g><rect x="258" y="86" width="7" height="7" transform="rotate(45 261.5 89.5)"/><rect x="271" y="86" width="7" height="7" transform="rotate(45 274.5 89.5)"/><rect x="284" y="86" width="7" height="7" transform="rotate(45 287.5 89.5)" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1"/></g>
    <g><rect x="258" y="108" width="7" height="7" transform="rotate(45 261.5 111.5)"/><rect x="271" y="108" width="7" height="7" transform="rotate(45 274.5 111.5)"/><rect x="284" y="108" width="7" height="7" transform="rotate(45 287.5 111.5)" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1"/></g>
    <g><rect x="258" y="130" width="7" height="7" transform="rotate(45 261.5 133.5)"/><rect x="271" y="130" width="7" height="7" transform="rotate(45 274.5 133.5)" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1"/><rect x="284" y="130" width="7" height="7" transform="rotate(45 287.5 133.5)" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1"/></g>
    <g><rect x="258" y="152" width="7" height="7" transform="rotate(45 261.5 155.5)"/><rect x="271" y="152" width="7" height="7" transform="rotate(45 274.5 155.5)" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1"/><rect x="284" y="152" width="7" height="7" transform="rotate(45 287.5 155.5)" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1"/></g>
  </g>
</svg>
