<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A ranked ledger with ratings marked in bronze">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--preview-bg-top, #2a221a)"/>
      <stop offset="1" stop-color="var(--preview-bg-bottom, #1d1813)"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#bg)"/>

  <!-- Plate border with corner studs -->
  <rect x="7" y="7" width="306" height="186" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1" opacity="0.4"/>
  <g fill="var(--preview-accent, #d6a65a)" opacity="0.7">
    <rect x="4" y="4" width="6" height="6" transform="rotate(45 7 7)"/>
    <rect x="310" y="4" width="6" height="6" transform="rotate(45 313 7)"/>
    <rect x="4" y="190" width="6" height="6" transform="rotate(45 7 193)"/>
    <rect x="310" y="190" width="6" height="6" transform="rotate(45 313 193)"/>
  </g>

  <!-- Rank numerals -->
  <g font-family="Cinzel, 'Times New Roman', serif" font-size="10" font-weight="700" fill="var(--preview-accent, #d6a65a)">
    <text x="24" y="40">I</text>
    <text x="24" y="74">II</text>
    <text x="24" y="108">III</text>
    <text x="24" y="142">IV</text>
    <text x="24" y="176">V</text>
  </g>

  <!-- Titles, as engraved strokes -->
  <g fill="var(--preview-cream, #eee2cb)" opacity="0.8">
    <rect x="50" y="32" width="96" height="6" rx="1"/>
    <rect x="50" y="66" width="112" height="6" rx="1"/>
    <rect x="50" y="100" width="58" height="6" rx="1"/>
    <rect x="50" y="134" width="84" height="6" rx="1"/>
    <rect x="50" y="168" width="110" height="6" rx="1"/>
  </g>

  <!-- Ratings: five bronze studs per row -->
  <g fill="var(--preview-accent, #d6a65a)">
    <g>
      <rect x="187" y="31" width="8" height="8" transform="rotate(45 191 35)"/><rect x="203" y="31" width="8" height="8" transform="rotate(45 207 35)"/><rect x="219" y="31" width="8" height="8" transform="rotate(45 223 35)"/><rect x="235" y="31" width="8" height="8" transform="rotate(45 239 35)"/><rect x="251" y="31" width="8" height="8" transform="rotate(45 255 35)"/>
    </g>
    <g>
      <rect x="187" y="65" width="8" height="8" transform="rotate(45 191 69)"/><rect x="203" y="65" width="8" height="8" transform="rotate(45 207 69)"/><rect x="219" y="65" width="8" height="8" transform="rotate(45 223 69)"/><rect x="235" y="65" width="8" height="8" transform="rotate(45 239 69)"/><rect x="251" y="65" width="8" height="8" transform="rotate(45 255 69)"/>
    </g>
    <g>
      <rect x="187" y="99" width="8" height="8" transform="rotate(45 191 103)"/><rect x="203" y="99" width="8" height="8" transform="rotate(45 207 103)"/><rect x="219" y="99" width="8" height="8" transform="rotate(45 223 103)"/><rect x="235" y="99" width="8" height="8" transform="rotate(45 239 103)"/>
      <rect x="251" y="99" width="8" height="8" transform="rotate(45 255 103)" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1"/><path d="M249.3 103 L255 97.3 L255 108.7 Z"/>
    </g>
    <g>
      <rect x="187" y="133" width="8" height="8" transform="rotate(45 191 137)"/><rect x="203" y="133" width="8" height="8" transform="rotate(45 207 137)"/><rect x="219" y="133" width="8" height="8" transform="rotate(45 223 137)"/><rect x="235" y="133" width="8" height="8" transform="rotate(45 239 137)"/>
      <rect x="251" y="133" width="8" height="8" transform="rotate(45 255 137)" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1"/>
    </g>
    <g>
      <rect x="187" y="167" width="8" height="8" transform="rotate(45 191 171)"/><rect x="203" y="167" width="8" height="8" transform="rotate(45 207 171)"/><rect x="219" y="167" width="8" height="8" transform="rotate(45 223 171)"/><rect x="235" y="167" width="8" height="8" transform="rotate(45 239 171)"/>
      <rect x="251" y="167" width="8" height="8" transform="rotate(45 255 171)" fill="none" stroke="var(--preview-accent, #d6a65a)" stroke-width="1"/>
    </g>
  </g>
  <g font-family="Cinzel, 'Times New Roman', serif" font-size="10" font-weight="700" fill="var(--preview-cream, #eee2cb)" text-anchor="end">
    <text x="294" y="39">10</text>
    <text x="294" y="73">10</text>
    <text x="294" y="107">9.5</text>
    <text x="294" y="141">9</text>
    <text x="294" y="175">8</text>
  </g>

  <!-- Ruled rows -->
  <g stroke="var(--preview-accent, #d6a65a)" stroke-width="0.8" opacity="0.25">
    <line x1="20" y1="52" x2="300" y2="52"/>
    <line x1="20" y1="86" x2="300" y2="86"/>
    <line x1="20" y1="120" x2="300" y2="120"/>
    <line x1="20" y1="154" x2="300" y2="154"/>
  </g>
</svg>
