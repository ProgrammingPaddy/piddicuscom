<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Pasted lines turning into a table">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--preview-bg-top, #2f2130)"/>
      <stop offset="1" stop-color="var(--preview-bg-bottom, #241a26)"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#bg)"/>

  <!-- Pasted text box: lines as bars, one per row -->
  <rect x="20" y="36" width="122" height="128" rx="10" fill="var(--preview-panel, #3b2a3b)"/>
  <g fill="var(--preview-line, #cbb3bf)" opacity="0.8">
    <rect x="32" y="50" width="74" height="6" rx="3"/>
    <rect x="32" y="66" width="52" height="6" rx="3"/>
    <rect x="32" y="82" width="88" height="6" rx="3"/>
    <rect x="32" y="98" width="64" height="6" rx="3"/>
    <rect x="32" y="114" width="80" height="6" rx="3"/>
    <rect x="32" y="130" width="46" height="6" rx="3"/>
    <rect x="32" y="146" width="60" height="6" rx="3"/>
  </g>
  <!-- Text cursor -->
  <rect x="96" y="143" width="1.5" height="12" fill="var(--preview-accent, #fec6d9)"/>

  <!-- Arrow across -->
  <path d="M152 100 h22" stroke="var(--preview-accent, #fec6d9)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M169 93 l8 7 l-8 7" fill="none" stroke="var(--preview-accent, #fec6d9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Table: title bar and rating bars per row -->
  <rect x="184" y="36" width="116" height="128" rx="10" fill="var(--preview-panel, #3b2a3b)"/>
  <g stroke="var(--preview-bg-bottom, #241a26)" stroke-width="1">
    <line x1="184" y1="58" x2="300" y2="58"/>
    <line x1="184" y1="80" x2="300" y2="80"/>
    <line x1="184" y1="102" x2="300" y2="102"/>
    <line x1="184" y1="124" x2="300" y2="124"/>
    <line x1="184" y1="146" x2="300" y2="146"/>
  </g>
  <g fill="var(--preview-cream, #f7edf1)" opacity="0.85">
    <rect x="192" y="44" width="42" height="6" rx="3"/>
    <rect x="192" y="66" width="30" height="6" rx="3"/>
    <rect x="192" y="88" width="50" height="6" rx="3"/>
    <rect x="192" y="110" width="36" height="6" rx="3"/>
    <rect x="192" y="132" width="46" height="6" rx="3"/>
    <rect x="192" y="154" width="26" height="6" rx="3"/>
  </g>
  <!-- Rating bars, three per row to fit -->
  <g fill="var(--preview-accent, #fec6d9)">
    <g><rect x="256" y="44" width="10" height="6" rx="3"/><rect x="269" y="44" width="10" height="6" rx="3"/><rect x="282" y="44" width="10" height="6" rx="3"/></g>
    <g><rect x="256" y="66" width="10" height="6" rx="3"/><rect x="269" y="66" width="10" height="6" rx="3"/><rect x="282" y="66" width="10" height="6" rx="3"/></g>
    <g><rect x="256" y="88" width="10" height="6" rx="3"/><rect x="269" y="88" width="10" height="6" rx="3"/><rect x="282" y="88" width="10" height="6" rx="3" fill="var(--preview-bg-bottom, #241a26)"/><rect x="282" y="88" width="7" height="6" rx="3"/></g>
    <g><rect x="256" y="110" width="10" height="6" rx="3"/><rect x="269" y="110" width="10" height="6" rx="3"/><rect x="282" y="110" width="10" height="6" rx="3" fill="var(--preview-bg-bottom, #241a26)"/><rect x="282" y="110" width="5" height="6" rx="3"/></g>
    <g><rect x="256" y="132" width="10" height="6" rx="3"/><rect x="269" y="132" width="10" height="6" rx="3"/><rect x="282" y="132" width="10" height="6" rx="3" fill="var(--preview-bg-bottom, #241a26)"/></g>
    <g><rect x="256" y="154" width="10" height="6" rx="3"/><rect x="269" y="154" width="10" height="6" rx="3" fill="var(--preview-bg-bottom, #241a26)"/><rect x="269" y="154" width="5" height="6" rx="3"/><rect x="282" y="154" width="10" height="6" rx="3" fill="var(--preview-bg-bottom, #241a26)"/></g>
  </g>
</svg>
