<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Five years of the Counter-Strike surf community survey, charted year by year, with every raw response underneath.">
    <meta name="keywords" content="data, games">
    <meta name="theme-color" content="#171015">
    <title>Surf Survey Results</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ------------------------------------------------------------------
           Tokens: lifted from piddicus.com base.css so the page sits inside
           the site without a seam. Chart colours are added at the bottom.
           ------------------------------------------------------------------ */
        :root {
            --color-bg: #171015;
            --color-bg-elevated: #221723;
            --color-surface: rgba(254, 198, 217, 0.05);
            --color-surface-hover: rgba(254, 198, 217, 0.09);
            --color-border: rgba(254, 198, 217, 0.12);
            --color-border-strong: rgba(254, 198, 217, 0.3);
            --color-text: #f7edf1;
            --color-text-muted: #c3aab6;
            --color-text-faint: #8c7382;
            --color-accent: #fec6d9;
            --color-accent-strong: #ffb0c9;
            --color-accent-soft: rgba(254, 198, 217, 0.16);
            --color-secondary: #a16564;
            --color-on-accent: #2a1220;

            --font-display: "Fredoka", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
            --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
            --font-mono: ui-monospace, "Cascadia Code", Consolas, monospace;
            --text-xs: 0.8rem;
            --text-sm: 0.9rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.375rem;
            --text-2xl: 1.875rem;
            --text-hero: clamp(2.4rem, 6vw, 4rem);

            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-12: 3rem;
            --space-16: 4rem;
            --space-24: 6rem;

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 26px;
            --radius-pill: 999px;

            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --duration-fast: 160ms;
            --duration-base: 320ms;
            --duration-slow: 720ms;

            --content-width: 1180px;

            /* Chart furniture. The chart surface is the card: plum + 5% pink. */
            --chart-surface: #1f161d;
            --chart-grid: rgba(254, 198, 217, 0.08);
            --chart-axis: rgba(254, 198, 217, 0.22);
            --chart-neutral: #6e5f6a;

            color-scheme: dark;
        }

        /* Reset -------------------------------------------------------------- */
        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        body {
            min-height: 100dvh;
            font-family: var(--font-body);
            font-size: var(--text-base);
            line-height: 1.6;
            color: var(--color-text);
            background-color: var(--color-bg);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        img, svg { display: block; max-width: 100%; }
        ul, ol { padding: 0; list-style: none; }
        a { color: inherit; text-decoration: none; }
        button, input, select { font: inherit; color: inherit; }
        button { background: none; border: none; cursor: pointer; }
        [hidden] { display: none !important; }
        :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; border-radius: var(--radius-sm); }
        ::selection { color: var(--color-on-accent); background: var(--color-accent); }
        h1, h2, h3 { font-family: var(--font-display); font-weight: 500; line-height: 1.15; letter-spacing: 0.005em; text-wrap: balance; }
        p { text-wrap: pretty; }
        code { padding: 0.1em 0.45em; font-family: var(--font-mono); font-size: 0.85em; color: var(--color-accent); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
        * { scrollbar-width: thin; scrollbar-color: rgba(254, 198, 217, 0.25) transparent; }

        /* Backdrop: a wireframe of surf ramps, drawn in app.js ----------------- */
        .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .backdrop__canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

        /* Page shell --------------------------------------------------------- */
        .page { width: min(100% - var(--space-12), var(--content-width)); margin: 0 auto; padding-bottom: var(--space-24); }

        .reveal { opacity: 0; transform: translateY(18px); transition: opacity var(--duration-slow) var(--ease-out), transform var(--duration-slow) var(--ease-out); transition-delay: var(--reveal-delay, 0ms); }
        .reveal.is-visible { opacity: 1; transform: none; }

        /* Hero --------------------------------------------------------------- */
        .hero { padding: var(--space-12) 0 var(--space-6); }
        .hero__title { font-size: var(--text-hero); font-weight: 600; letter-spacing: -0.01em; }

        /* Filter bar --------------------------------------------------------- */
        .filterbar { position: sticky; top: 42px; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); margin: var(--space-4) 0 var(--space-8); padding: var(--space-3) var(--space-4); background: color-mix(in srgb, var(--color-bg) 78%, transparent); border: 1px solid var(--color-border); border-radius: var(--radius-lg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
        .filterbar__label { font-family: var(--font-display); font-size: var(--text-sm); color: var(--color-text-faint); }
        .filter { display: flex; flex-wrap: wrap; gap: var(--space-2); }
        .chip { display: inline-flex; align-items: center; gap: 8px; padding: var(--space-1) var(--space-4); font-family: var(--font-display); font-size: var(--text-sm); color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: var(--radius-pill); transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out), background-color var(--duration-fast) var(--ease-out), transform var(--duration-base) var(--ease-bounce); }
        .chip:hover { color: var(--color-text); border-color: var(--color-border-strong); transform: translateY(-1px); }
        .chip[aria-pressed="true"] { color: var(--color-on-accent); background: var(--color-accent); border-color: var(--color-accent); }
        .chip__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--color-accent)); box-shadow: 0 0 0 2px var(--chart-surface); }
        .chip[aria-pressed="true"] .chip__dot { box-shadow: 0 0 0 2px var(--color-accent); }
        .chip--ghost { border-style: dashed; }
        .filterbar__count { margin-left: auto; font-family: var(--font-display); font-size: var(--text-sm); color: var(--color-text-faint); }
        .filterbar__jump { font-family: var(--font-display); font-size: var(--text-sm); color: var(--color-text-muted); }
        .filterbar__jump:hover { color: var(--color-accent); }

        /* Sections and cards ------------------------------------------------- */
        .section { padding: var(--space-8) 0 var(--space-4); }
        .section__head { margin-bottom: var(--space-4); }
        .section__title { font-size: var(--text-2xl); }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); grid-auto-flow: dense; gap: var(--space-4); }
        .card { position: relative; display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; padding: var(--space-6); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); transition: border-color var(--duration-base) var(--ease-out), background-color var(--duration-base) var(--ease-out); }
        .card:hover { background: var(--color-surface-hover); border-color: var(--color-border-strong); }
        .card--wide { grid-column: span 2; }
        .card--full { grid-column: 1 / -1; }
        @media (max-width: 800px) { .card--wide { grid-column: auto; } }
        .card__head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--space-2) var(--space-3); }
        .card__head > div:first-child { flex: 1 1 220px; min-width: 0; }
        .card__title { font-size: var(--text-xl); }
        .card__tag { display: inline-block; margin-top: 4px; padding: 0 8px; font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-faint); border: 1px solid var(--color-border); border-radius: var(--radius-pill); }
        .card__note { font-size: var(--text-xs); color: var(--color-text-faint); }
        .card__tools { display: flex; flex-shrink: 0; gap: var(--space-1); }
        .card__body { position: relative; min-width: 0; }
        .card__body svg { width: 100%; height: auto; overflow: visible; font-family: var(--font-body); }
        .card__empty { padding: var(--space-8) var(--space-4); text-align: center; font-size: var(--text-sm); color: var(--color-text-faint); border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); }
        .card__foot { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); font-size: var(--text-xs); color: var(--color-text-faint); }

        .seg { display: inline-flex; padding: 3px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--color-border); border-radius: var(--radius-pill); }
        .seg button { padding: 2px 10px; font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-faint); border-radius: var(--radius-pill); transition: color var(--duration-fast), background-color var(--duration-fast); }
        .seg button:hover { color: var(--color-text); }
        .seg button[aria-pressed="true"] { color: var(--color-on-accent); background: var(--color-accent); }
        .iconbtn { display: grid; place-items: center; width: 28px; height: 28px; color: var(--color-text-faint); border: 1px solid var(--color-border); border-radius: 50%; transition: color var(--duration-fast), border-color var(--duration-fast), background-color var(--duration-fast); }
        .iconbtn:hover, .iconbtn[aria-pressed="true"] { color: var(--color-text); border-color: var(--color-border-strong); background: var(--color-surface-hover); }

        /* Legend --------------------------------------------------------------- */
        .legend { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); }
        .legend__item { display: inline-flex; align-items: center; gap: 7px; padding: 2px 8px 2px 4px; font-size: var(--text-xs); color: var(--color-text-muted); border-radius: var(--radius-pill); transition: opacity var(--duration-fast), background-color var(--duration-fast); }
        .legend__item:hover { background: var(--color-surface-hover); color: var(--color-text); }
        .legend__item.is-dim { opacity: 0.4; }
        .legend__item[aria-pressed="true"] { color: var(--color-text); background: var(--color-accent-soft); }
        .legend__swatch { width: 12px; height: 12px; border-radius: 4px; background: var(--sw); flex: none; }
        .legend__swatch--line { width: 14px; height: 3px; border-radius: 2px; }

        /* Median tiles inside numeric cards ----------------------------------- */
        .medians { display: flex; flex-wrap: wrap; gap: var(--space-2); }
        .median { display: inline-flex; align-items: baseline; gap: 6px; padding: 2px 10px; font-size: var(--text-xs); color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: var(--radius-pill); }
        .median b { font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600; color: var(--color-text); }
        .median i { width: 8px; height: 8px; border-radius: 50%; background: var(--sw); align-self: center; }

        /* Data table twin ----------------------------------------------------- */
        .twin { overflow-x: auto; }
        .twin table { width: 100%; border-collapse: collapse; font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
        .twin th, .twin td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
        .twin th:first-child, .twin td:first-child { text-align: left; }
        .twin th { font-family: var(--font-display); font-weight: 500; color: var(--color-text-faint); }

        /* Rank grid (favourite maps by year) ---------------------------------- */
        .rankgrid { display: grid; gap: 4px; overflow-x: auto; }
        .rankgrid__head, .rankgrid__cell { padding: 6px 10px; font-size: var(--text-xs); border-radius: var(--radius-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rankgrid__head { font-family: var(--font-display); color: var(--color-text-faint); text-align: center; }
        .rankgrid__rank { display: grid; place-items: center; font-family: var(--font-display); color: var(--color-text-faint); }
        .rankgrid__cell { position: relative; background: var(--color-surface); color: var(--color-text); text-align: center; border: 1px solid transparent; transition: border-color var(--duration-fast); }
        .rankgrid__cell:hover { border-color: var(--color-border-strong); }
        .rankgrid__cell b { font-weight: 600; }
        .rankgrid__cell small { margin-left: 6px; color: inherit; opacity: 0.65; }
        .rankgrid__cell.is-hot { color: var(--color-on-accent); }

        /* Suggestions list ------------------------------------------------------- */
        .sugg { columns: 3 280px; column-gap: var(--space-6); }
        .sugg li { break-inside: avoid; padding: 6px 0; font-size: var(--text-sm); line-height: 1.45; color: var(--color-text-muted); border-bottom: 1px solid var(--color-border); white-space: pre-line; overflow-wrap: anywhere; }

        /* Raw responses explorer ---------------------------------------------- */
        .raw { margin-top: var(--space-16); }
        .raw__toggle { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); width: 100%; padding: var(--space-4) var(--space-6); text-align: left; background: var(--color-surface); border: 1px dashed var(--color-border-strong); border-radius: var(--radius-lg); transition: background-color var(--duration-base), border-color var(--duration-base); }
        .raw__toggle:hover { background: var(--color-surface-hover); border-color: var(--color-accent); }
        .raw__toggle h2 { font-size: var(--text-xl); }
        .raw__toggle p { font-size: var(--text-sm); color: var(--color-text-muted); }
        .raw__toggle .chev { font-size: var(--text-xl); color: var(--color-accent); transition: transform var(--duration-base) var(--ease-bounce); }
        .raw__toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
        .raw__toggle[aria-expanded="true"] { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-color: transparent; }
        .raw__panel { padding: var(--space-4) var(--space-6) var(--space-6); background: rgba(0, 0, 0, 0.18); border: 1px dashed var(--color-border-strong); border-top: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
        .raw__bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
        .raw__bar .filter { gap: var(--space-1); }
        .raw__search { flex: 1 1 220px; padding: var(--space-2) var(--space-4); color: var(--color-text); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-pill); }
        .raw__search::placeholder { color: var(--color-text-faint); }
        .raw__search:focus { outline: none; border-color: var(--color-accent); }
        .raw__meta { font-family: var(--font-display); font-size: var(--text-sm); color: var(--color-text-faint); }
        .raw__cols { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: var(--space-3); }
        .raw__cols summary { cursor: pointer; font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-faint); list-style: none; }
        .raw__cols summary::-webkit-details-marker { display: none; }
        .raw__cols summary::before { content: "\25B8 "; }
        details[open] .raw__cols summary::before, .raw__colsbox[open] summary::before { content: "\25BE "; }
        .raw__colsbox { margin-bottom: var(--space-3); }
        .colchip { padding: 1px 10px; font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-text-faint); border: 1px solid var(--color-border); border-radius: var(--radius-pill); }
        .colchip[aria-pressed="true"] { color: var(--color-text); border-color: var(--color-border-strong); background: var(--color-surface-hover); }
        .raw__scroll { max-height: 70vh; overflow: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); }
        .raw__table { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: var(--text-xs); }
        .raw__table th { position: sticky; top: 0; z-index: 2; padding: 8px 10px; font-family: var(--font-display); font-weight: 500; text-align: left; color: var(--color-text-muted); background: var(--color-bg-elevated); border-bottom: 1px solid var(--color-border-strong); white-space: nowrap; cursor: pointer; user-select: none; }
        .raw__table th:hover { color: var(--color-accent); }
        .raw__table th .dir { margin-left: 4px; color: var(--color-accent); }
        .raw__table td { padding: 6px 10px; vertical-align: top; border-bottom: 1px solid var(--color-border); max-width: 380px; overflow-wrap: anywhere; }
        .raw__table td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .raw__table td.idx, .raw__table th.idx { color: var(--color-text-faint); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .raw__table td.ts { white-space: nowrap; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
        .raw__table td.empty { color: var(--color-text-faint); }
        .raw__table tbody tr:hover td { background: var(--color-surface); }
        .raw__table mark { padding: 0 2px; color: var(--color-on-accent); background: var(--color-accent); border-radius: 3px; }
        .raw__pager { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); margin-top: var(--space-3); font-size: var(--text-sm); color: var(--color-text-faint); }
        .raw__pager .spacer { flex: 1; }
        .btn { padding: var(--space-1) var(--space-4); font-family: var(--font-display); font-size: var(--text-sm); color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: var(--radius-pill); transition: color var(--duration-fast), border-color var(--duration-fast), transform var(--duration-base) var(--ease-bounce); }
        .btn:hover:not(:disabled) { color: var(--color-text); border-color: var(--color-border-strong); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.35; cursor: default; }
        .btn--accent { color: var(--color-on-accent); background: var(--color-accent); border-color: var(--color-accent); }

        /* Tooltip ---------------------------------------------------------------- */
        .tip { position: fixed; z-index: 50; max-width: 300px; padding: 8px 12px; font-size: var(--text-xs); line-height: 1.45; color: var(--color-text); background: var(--color-bg-elevated); border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.8); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity var(--duration-fast), transform var(--duration-fast); }
        .tip.is-on { opacity: 1; transform: none; }
        .tip__title { font-family: var(--font-display); color: var(--color-text-muted); margin-bottom: 4px; }
        .tip__row { display: flex; align-items: center; gap: 8px; }
        .tip__row.is-hot { color: var(--color-accent); }
        .tip__key { width: 12px; height: 3px; border-radius: 2px; background: var(--sw); flex: none; }
        .tip__val { font-weight: 700; min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
        .tip__lbl { color: var(--color-text-muted); }

        /* Footer -------------------------------------------------------------- */
        .site-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); width: min(100% - var(--space-12), var(--content-width)); margin: 0 auto; padding: var(--space-8) 0; font-size: var(--text-sm); color: var(--color-text-faint); border-top: 1px solid var(--color-border); }
        .site-footer a:hover { color: var(--color-text); }

        /* SVG chart pieces ------------------------------------------------------ */
        .ax { font-size: 11px; fill: var(--color-text-faint); }
        .ax--y { font-size: 12px; fill: var(--color-text-muted); }
        .grid { stroke: var(--chart-grid); stroke-width: 1; }
        .base { stroke: var(--chart-axis); stroke-width: 1; }
        .seglbl { font-size: 11px; font-weight: 700; pointer-events: none; }
        .barlbl { font-size: 11px; fill: var(--color-text-muted); font-variant-numeric: tabular-nums; }
        .endlbl { font-size: 11px; fill: var(--color-text-muted); }
        .mark { transition: opacity var(--duration-fast); }
        .mark.is-dim { opacity: 0.25; }
        .hit { fill: transparent; }
        .cross { stroke: var(--chart-axis); stroke-width: 1; pointer-events: none; }

        /* Responsive ------------------------------------------------------------ */
        @media (max-width: 640px) {
            .page, .site-footer { width: min(100% - var(--space-8), var(--content-width)); }
            .hero { padding-top: var(--space-8); }
            .card { padding: var(--space-4); }
            .filterbar { top: 42px; border-radius: var(--radius-md); }
            .filterbar__count { margin-left: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .reveal { opacity: 1; transform: none; transition: none; }
            .chip:hover, .btn:hover:not(:disabled) { transform: none; }
        }
    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <canvas class="backdrop__canvas" id="backdrop"></canvas>
    </div>

    <main class="page">
        <section class="hero">
            <h1 class="hero__title reveal">Surf Survey Results</h1>
        </section>

        <div class="filterbar reveal" id="filterbar" role="group" aria-label="Choose survey years">
            <span class="filterbar__label">Years</span>
            <div class="filter" id="year-filter"></div>
            <button class="chip chip--ghost" id="year-all" type="button">all</button>
            <span class="filterbar__count" id="filter-count" aria-live="polite"></span>
            <a class="filterbar__jump" href="#raw">raw responses &darr;</a>
        </div>

        <div id="sections"></div>

        <section class="raw" id="raw" aria-label="Raw responses">
            <button class="raw__toggle" id="raw-toggle" type="button" aria-expanded="false" aria-controls="raw-panel">
                <span>
                    <h2>Raw responses</h2>
                    <p>Every response, by year.</p>
                </span>
                <span class="chev" aria-hidden="true">&#9662;</span>
            </button>
            <div class="raw__panel" id="raw-panel" hidden>
                <div class="raw__bar">
                    <div class="filter" id="raw-years" role="tablist" aria-label="Survey year"></div>
                    <input class="raw__search" id="raw-search" type="search" placeholder="Search responses…" aria-label="Search responses">
