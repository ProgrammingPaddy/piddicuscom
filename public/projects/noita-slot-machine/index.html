<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noita Slot Machine</title>
<style>
:root{
  --bg:#17120f;
  --bg-2:#1f1814;
  --panel:#261d18;
  --panel-2:#2f241e;
  --panel-3:#382a22;
  --panel-4:#433128;
  --line:#4b392f;
  --line-soft:#3b2d26;
  --text:#f1e9e3;
  --muted:#b9a89d;
  --muted-2:#8f7d72;
  --accent:#c79b7b;
  --accent-2:#a97859;
  --accent-soft:#4a3428;
  --good:#b7c5a2;
  --danger:#c88f83;
  --shadow:0 18px 45px rgba(0,0,0,.28);
  --radius:14px;
  --radius-sm:9px;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -20%, rgba(164,113,82,.08), transparent 34rem),
    var(--bg);
  font-family:var(--sans);
  letter-spacing:.005em;
}
button,input,select{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
img{display:block}
.app{max-width:1440px;margin:0 auto;padding:28px 22px 54px}
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px
}
.brand h1{font-size:25px;line-height:1.1;margin:0 0 7px;font-weight:720;letter-spacing:-.02em}
.data-status{
  display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;
  border:1px solid var(--line-soft);background:var(--panel);border-radius:999px;padding:7px 10px
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
.dot.live{background:var(--good)}
.slot-panel,.progress-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.reel{
  min-height:172px;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:13px;
  padding:15px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden
}
.reel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.reel-label{
  color:var(--muted);font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.14em
}
.pool-count{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.reel-main{
  display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:center;min-height:76px
}
.roll-icon{
  width:60px;height:60px;border-radius:12px;border:1px solid var(--line-soft);background:var(--panel-3);
  display:grid;place-items:center;overflow:hidden;position:relative
}
.roll-icon img{
  width:100%;height:100%;object-fit:contain;padding:6px;image-rendering:pixelated
}
.roll-icon.placeholder:before{
  content:"";width:26px;height:26px;border-radius:8px;border:1px dashed #7d6252;background:#251b16
}
.reel-value{
  min-height:58px;display:flex;align-items:center;font-size:24px;line-height:1.16;font-weight:690;
  letter-spacing:-.02em;word-break:break-word
}
.reel-value.spinning{color:var(--muted)}
.reel-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reel-group{font-size:11px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn,.tiny-btn,.secondary-btn,.primary-btn,.ghost-btn{
  border:1px solid var(--line);background:var(--panel-2);border-radius:9px;cursor:pointer;
  transition:background .12s,border-color .12s,transform .08s
}
.icon-btn:hover,.tiny-btn:hover,.secondary-btn:hover,.ghost-btn:hover{background:var(--panel-3);border-color:#60483b}
.icon-btn:active,.tiny-btn:active,.secondary-btn:active,.primary-btn:active,.ghost-btn:active{transform:translateY(1px)}
.icon-btn{width:31px;height:29px;display:grid;place-items:center;font-size:15px}
.roll-row{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-top:15px
}
.stats{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.stats.right{text-align:right}
.primary-btn{
  border-color:#a87558;background:var(--accent-2);padding:12px 28px;font-weight:760;
  min-width:170px;letter-spacing:.04em;text-transform:uppercase
}
.primary-btn:hover{background:#ba8462}
.primary-btn:disabled{opacity:.45;cursor:not-allowed}
.progress-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px
}
.progress-title{font-size:16px;font-weight:720}
.progress-sections{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px
}
.progress-col{
  background:var(--bg-2);border:1px solid var(--line-soft);border-radius:13px;padding:12px
}
.progress-col-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px
}
.progress-col-title{
  font-size:12px;font-weight:770;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)
}
.progress-match{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.icon-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:7px
}
.progress-icon{
  aspect-ratio:1/1;border-radius:10px;border:1px solid var(--line-soft);background:var(--panel-3);
  display:grid;place-items:center;padding:3px;position:relative;overflow:hidden
}
.progress-icon img{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:grayscale(1) brightness(.7);
  opacity:.45;transition:filter .12s,opacity .12s,transform .12s
}
.progress-icon.selected{
  background:var(--panel-4);border-color:#8f684f;box-shadow:inset 0 0 0 1px rgba(199,155,123,.25)
}
.progress-icon.selected img{
  filter:none;opacity:1;transform:scale(1.02)
}
.progress-icon.missing:before{
  content:"";width:16px;height:16px;border-radius:5px;border:1px dashed #7b6252;background:#261c17
}
.progress-icon:hover{border-color:#6a5042}
.workspace{
  display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px;align-items:start
}
.sidebar,.pool-panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)
}
.sidebar{padding:12px;position:sticky;top:16px}
.side-title{
  color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;
  margin:6px 8px 8px
}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:14px}
.tab{
  border:1px solid transparent;background:transparent;color:var(--muted);padding:8px 5px;
  border-radius:8px;cursor:pointer;font-size:12px;font-weight:700
}
.tab.active{background:var(--accent-soft);color:var(--text);border-color:#604536}
.group-list{display:flex;flex-direction:column;gap:4px;margin-bottom:13px}
.group-row{
  width:100%;display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:7px;
  text-align:left;border:0;background:transparent;color:var(--text);padding:7px 8px;border-radius:8px;cursor:pointer
}
.group-row:hover{background:rgba(255,255,255,.035)}
.group-row.selected{background:var(--panel-3)}
.group-check{
  width:14px;height:14px;border-radius:4px;border:1px solid #6c5142;background:var(--bg-2);
  display:grid;place-items:center;font-size:10px;color:#201612
}
.group-check.on{background:var(--accent);border-color:var(--accent)}
.group-check.partial{background:#6e5140;border-color:#80614e}
.group-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-num{font-family:var(--mono);font-size:10px;color:var(--muted-2)}
.divider{height:1px;background:var(--line-soft);margin:10px 4px}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ghost-btn,.secondary-btn,.tiny-btn{padding:8px 10px;font-size:11px}
.ghost-btn{background:transparent;border-color:var(--line-soft);color:var(--muted)}
.custom-group-row{
  display:grid;grid-template-columns:18px 1fr auto auto;align-items:center;gap:5px;padding:5px 5px 5px 8px;border-radius:8px
}
.custom-group-row:hover{background:rgba(255,255,255,.025)}
.custom-toggle{
  border:0;background:transparent;color:inherit;cursor:pointer;padding:0;display:contents
}
.mini-action{
  width:24px;height:24px;border:0;background:transparent;color:var(--muted-2);border-radius:6px;cursor:pointer
}
.mini-action:hover{background:var(--panel-3);color:var(--text)}
.pool-panel{min-height:620px;overflow:hidden}
.pool-toolbar{
  display:flex;align-items:center;gap:9px;padding:12px;border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;background:rgba(38,29,24,.97);backdrop-filter:blur(8px);z-index:5
}
.search-wrap{position:relative;flex:1}
.search{
  width:100%;border:1px solid var(--line);background:var(--bg-2);color:var(--text);
  border-radius:9px;padding:9px 12px 9px 34px;font-size:12px
}
.search::placeholder{color:var(--muted-2)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:13px}
.toolbar-count{font-family:var(--mono);font-size:11px;color:var(--muted-2);white-space:nowrap}
.items{padding:8px}
.item-row{
  display:grid;grid-template-columns:30px 34px 1fr auto;align-items:center;gap:10px;min-height:45px;
  padding:4px 8px;border-radius:8px
}
.item-row:hover{background:rgba(255,255,255,.025)}
.switch{
  width:28px;height:17px;border:1px solid #624b3f;background:var(--bg-2);border-radius:999px;
  position:relative;cursor:pointer;transition:.12s
}
.switch:after{
  content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:#7e6c62;transition:.12s
}
.switch.on{background:var(--accent-soft);border-color:#9a6e54}
.switch.on:after{left:13px;background:var(--accent)}
.item-icon{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line-soft);background:var(--panel-3);
  display:grid;place-items:center;overflow:hidden
}
.item-icon img{
  width:100%;height:100%;object-fit:contain;padding:3px;image-rendering:pixelated
}
.item-icon.placeholder:before{
  content:"";width:14px;height:14px;border-radius:4px;border:1px dashed #7c6252;background:#261c17
}
.item-name{font-size:13px}
.item-id{font-family:var(--mono);font-size:10px;color:var(--muted-2);margin-top:2px}
.item-group{
  font-size:10px;color:var(--muted-2);border:1px solid var(--line-soft);border-radius:999px;padding:4px 7px
}
.empty{padding:48px;text-align:center;color:var(--muted);font-size:13px}
.footer-tools{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:9px;
  margin-top:12px;color:var(--muted-2);font-size:11px
}
.tool-cluster{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.select{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 30px 8px 10px;font-size:11px
}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,7,5,.72);display:none;align-items:center;justify-content:center;
  padding:20px;z-index:20
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(760px,100%);max-height:min(780px,92vh);background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden
}
.modal-head{padding:16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:720}
.modal-body{padding:14px;overflow:auto}
.form-label{display:block;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.11em;margin:0 0 6px}
.text-input{
  width:100%;border:1px solid var(--line);background:var(--bg-2);color:var(--text);
  border-radius:9px;padding:10px 11px;margin-bottom:12px
}
.member-list{border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.member-toolbar{padding:8px;border-bottom:1px solid var(--line-soft);display:flex;gap:7px}
.member-items{max-height:430px;overflow:auto;padding:5px}
.member-row{
  display:grid;grid-template-columns:20px 30px 1fr auto;gap:9px;align-items:center;padding:7px;border-radius:7px
}
.member-row:hover{background:rgba(255,255,255,.025)}
.checkbox{
  width:15px;height:15px;border:1px solid #6b5142;background:var(--bg-2);border-radius:4px;display:grid;place-items:center;cursor:pointer;font-size:10px
}
.checkbox.on{background:var(--accent);border-color:var(--accent);color:#241813}
.modal-foot{padding:12px 14px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px}
.toast{
  position:fixed;right:18px;bottom:18px;background:#32251e;border:1px solid #664c3e;color:var(--text);
  border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);
  pointer-events:none;transition:.18s;z-index:30
}
.toast.show{opacity:1;transform:translateY(0)}
.file-input{display:none}
@media(max-width:1100px){
  .progress-sections{grid-template-columns:1fr}
}
@media(max-width:850px){
  .workspace{grid-template-columns:1fr}
  .sidebar{position:static}
  .reels{grid-template-columns:1fr}
  .roll-row{grid-template-columns:1fr}
  .stats.right,.stats{text-align:center}
  .primary-btn{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>Noita Slot Machine</h1>
    </div>
    <div class="data-status"><span id="dataDot" class="dot"></span><span id="dataText">Loading dataset…</span></div>
  </div>

  <section class="slot-panel">
    <div class="reels">
      <div class="reel">
        <div class="reel-head"><span class="reel-label">Perk</span><span class="pool-count" id="perkCount">0 enabled</span></div>
        <div class="reel-main">
          <div class="roll-icon placeholder" id="perkIcon"></div>
          <div class="reel-value" id="perkValue">—</div>
        </div>
        <div class="reel-foot"><span class="reel-group" id="perkGroup">Ready</span><button class="icon-btn" data-reroll="perks" title="Reroll perk">↻</button></div>
      </div>
      <div class="reel">
        <div class="reel-head"><span class="reel-label">Spell</span><span class="pool-count" id="spellCount">0 enabled</span></div>
        <div class="reel-main">
          <div class="roll-icon placeholder" id="spellIcon"></div>
          <div class="reel-value" id="spellValue">—</div>
        </div>
        <div class="reel-foot"><span class="reel-group" id="spellGroup">Ready</span><button class="icon-btn" data-reroll="spells" title="Reroll spell">↻</button></div>
      </div>
      <div class="reel">
        <div class="reel-head"><span class="reel-label">Enemy</span><span class="pool-count" id="enemyCount">0 enabled</span></div>
        <div class="reel-main">
          <div class="roll-icon placeholder" id="enemyIcon"></div>
          <div class="reel-value" id="enemyValue">—</div>
        </div>
        <div class="reel-foot"><span class="reel-group" id="enemyGroup">Ready</span><button class="icon-btn" data-reroll="enemies" title="Reroll enemy">↻</button></div>
      </div>
    </div>
    <div class="roll-row">
      <div class="stats" id="statsLeft">Pools loading…</div>
      <button class="primary-btn" id="rollAll">Roll Challenge</button>
      <div class="stats right" id="statsRight">0 possible combinations</div>
    </div>
  </section>

  <section class="progress-panel">
    <div class="progress-head">
      <div>
        <div class="progress-title">Progress-style roll board</div>
      </div>
    </div>
    <div class="progress-sections">
      <div class="progress-col">
        <div class="progress-col-head"><span class="progress-col-title">Perks</span><span class="progress-match" id="perkProgressMeta">0 shown</span></div>
        <div class="icon-grid" id="perkProgressGrid"></div>
      </div>
      <div class="progress-col">
        <div class="progress-col-head"><span class="progress-col-title">Spells</span><span class="progress-match" id="spellProgressMeta">0 shown</span></div>
        <div class="icon-grid" id="spellProgressGrid"></div>
      </div>
      <div class="progress-col">
        <div class="progress-col-head"><span class="progress-col-title">Enemies</span><span class="progress-match" id="enemyProgressMeta">0 shown</span></div>
        <div class="icon-grid" id="enemyProgressGrid"></div>
      </div>
    </div>
  </section>

  <div class="workspace">
    <aside class="sidebar">
      <div class="tabs">
        <button class="tab active" data-tab="spells">Spells</button>
        <button class="tab" data-tab="perks">Perks</button>
        <button class="tab" data-tab="enemies">Enemies</button>
      </div>

      <div class="side-title">Built-in groups</div>
      <div class="group-list" id="builtInGroups"></div>

      <div class="divider"></div>
      <div class="side-title">Custom groups</div>
      <div id="customGroups"></div>
      <button class="ghost-btn" id="newGroup" style="width:100%;margin-top:5px">+ New custom group</button>

      <div class="divider"></div>
      <div class="side-actions">
        <button class="ghost-btn" id="enableAll">Enable all</button>
        <button class="ghost-btn" id="disableAll">Disable all</button>
      </div>
    </aside>

    <main class="pool-panel">
      <div class="pool-toolbar">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input class="search" id="search" placeholder="Search spells…">
        </div>
        <button class="tiny-btn" id="enableVisible">Enable visible</button>
        <button class="tiny-btn" id="disableVisible">Disable visible</button>
        <span class="toolbar-count" id="visibleCount"></span>
      </div>
      <div class="items" id="items"></div>
    </main>
  </div>

  <div class="footer-tools">
    <div class="tool-cluster">
      <select class="select" id="presetSelect"><option value="">Presets…</option></select>
      <button class="ghost-btn" id="savePreset">Save current preset</button>
      <button class="ghost-btn" id="deletePreset">Delete preset</button>
    </div>
    <div class="tool-cluster">
      <button class="ghost-btn" id="exportConfig">Export config</button>
      <button class="ghost-btn" id="importConfig">Import config</button>
      <input class="file-input" type="file" accept=".json,application/json" id="importFile">
      <button class="ghost-btn" id="resetApp">Reset</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">New custom group</div>
      <button class="icon-btn" id="closeModal">×</button>
    </div>
    <div class="modal-body">
      <label class="form-label" for="groupName">Group name</label>
      <input class="text-input" id="groupName" placeholder="e.g. Early-game reasonable">
      <div class="member-list">
        <div class="member-toolbar">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input class="search" id="memberSearch" placeholder="Search members…">
          </div>
          <button class="tiny-btn" id="selectFiltered">Select filtered</button>
          <button class="tiny-btn" id="clearFiltered">Clear filtered</button>
        </div>
        <div class="member-items" id="memberItems"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="secondary-btn" id="cancelModal">Cancel</button>
      <button class="primary-btn" id="saveGroup" style="min-width:120px;padding:9px 16px">Save group</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const REMOTE_DATA = 'https://raw.githubusercontent.com/ipeterov/noita-progress/refs/heads/master/src/icons.json';
const ASSET_BASES = [
  'https://raw.githubusercontent.com/ipeterov/noita-progress/refs/heads/master/src/',
  'https://raw.githubusercontent.com/ipeterov/noita-progress/refs/heads/master/'
];
const STORAGE_KEY = 'noita-slot-machine-v2';
const DATA_CACHE_KEY = 'noita-slot-machine-dataset-v2';

const FALLBACK = {
  spells: [
    ['LIGHT_BULLET','Spark Bolt','Projectile'],['LIGHT_BULLET_TRIGGER','Spark Bolt with Trigger','Projectile'],
    ['BUBBLESHOT','Bubble Spark','Projectile'],['BOMB','Bomb','Projectile'],['BLACK_HOLE','Black Hole','Projectile'],
    ['TELEPORT_PROJECTILE','Teleport Bolt','Projectile'],['NUKE','Nuke','Projectile'],['CHAINSAW','Chainsaw','Projectile'],
    ['LUMINOUS_DRILL','Luminous Drill','Projectile'],['MANA_REDUCE','Add Mana','Modifier'],['DAMAGE','Damage Plus','Modifier'],
    ['HOMING','Homing','Modifier'],['PIERCING_SHOT','Piercing Shot','Modifier'],['SPEED','Speed Up','Modifier'],
    ['RECHARGE','Reduce Recharge Time','Modifier'],['BURST_2','Double Spell','Multicast'],['BURST_3','Triple Spell','Multicast'],
    ['BURST_4','Quadruple Spell','Multicast'],['LONG_DISTANCE_CAST','Long-Distance Cast','Utility'],['TELEPORT_CAST','Teleporting Cast','Utility'],
    ['ENERGY_SHIELD','Energy Shield','Passive'],['TORCH','Torch','Passive'],['ALPHA','Alpha','Other'],['OMEGA','Omega','Other'],
    ['TOUCH_GOLD','Touch Of Gold','Material'],['SEA_WATER','Sea Of Water','Material']
  ].map((x,i)=>({id:x[0],name:x[1],group:x[2],icon:null,sortIndex:i})),
  perks: [
    'All-Seeing Eye','Always Cast','Angry Ghost','Attract Gold','Bombs Materialized','Boomerang Spells','Bouncing Spells',
    'Breathless','Close Call','Concentrated Spells','Critical Hit +','Electricity Immunity','Explosion Immunity','Fire Immunity',
    'Glass Cannon','Gold is Forever','Melee Immunity','No More Shuffle','Peace with Gods','Permanent Shield','Perk Lottery',
    'Saving Grace','Stainless Armour','Tinker with Wands Everywhere','Unlimited Spells','Vampirism'
  ].map((name,i)=>({id:'perk_'+i,name,group:'Perks',icon:null,sortIndex:i})),
  enemies: [
    'Tappurahiisi','Haulikkohiisi','Rynkkyhiisi','Kranuhiisi','Snipuhiisi','Tulihiisi','Parantajahiisi','Kilpihiisi',
    'Limanuljaska','Happonuljaska','Rotta','Lepakko','Konna','Jättikonna','Märkiäinen','Stendari','Ukko','Stevari',
    'Matosade','Kolmisilmä'
  ].map((name,i)=>({id:'enemy_'+i,name,group:'Enemies',icon:null,sortIndex:i}))
};

const el = id => document.getElementById(id);
const state = {
  data: {spells:[],perks:[],enemies:[]},
  enabled: {spells:{},perks:{},enemies:{}},
  customGroups: [],
  presets: {},
  tab: 'spells',
  selectedBuiltIn: 'All',
  query: '',
  current: {spells:null,perks:null,enemies:null},
  modal: {editId:null,members:new Set()}
};

function toast(msg){
  const t=el('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}
function save(){
  const payload = {
    enabled:state.enabled, customGroups:state.customGroups, presets:state.presets,
    current:Object.fromEntries(Object.entries(state.current).map(([k,v])=>[k,v?.id||null]))
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
}
function loadSaved(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}
}
function normGroup(path){
  if(!path) return 'Other';
  const s=path.toLowerCase();
  if(s.includes('static')) return 'Static Projectile';
  if(s.includes('projectile')) return 'Projectile';
  if(s.includes('modifier')) return 'Modifier';
  if(s.includes('draw_many')||s.includes('multicast')) return 'Multicast';
  if(s.includes('material')) return 'Material';
  if(s.includes('utility')) return 'Utility';
  if(s.includes('passive')) return 'Passive';
  if(s.includes('other')) return 'Other';
  return 'Other';
}
function normalize(raw){
  const enemies=(raw.enemies||[])
    .filter(x=>x && x.name && x.id !== 'player')
    .map((x,i)=>({id:String(x.id),name:String(x.name),group:'Enemies',icon:x.image_path||null,sortIndex:i}));
  const perks=(raw.perks||[])
    .filter(x=>x && x.name)
    .map((x,i)=>({id:String(x.id),name:String(x.name).replace(/\s*\(One-off\)\s*/ig,''),group:'Perks',icon:x.image_path||null,sortIndex:i}));
  const spells=(raw.spells||[])
    .filter(x=>x && x.name)
    .map((x,i)=>({
      id:String(x.id),
      name:String(x.name),
      group:normGroup(x.background_path || x.image_path || ''),
      icon:x.image_path||null,
      sortIndex:i
    }));
  return {spells,perks,enemies};
}
async function loadDataset(){
  const cached = localStorage.getItem(DATA_CACHE_KEY);
  if(cached){
    try{
      const parsed=JSON.parse(cached);
      if(parsed.spells?.length && parsed.perks?.length && parsed.enemies?.length){
        setDataset(parsed,'Cached full dataset');
      }
    }catch{}
  }
  try{
    const r=await fetch(REMOTE_DATA,{cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const raw=await r.json();
    const data=normalize(raw);
    if(!data.spells.length || !data.perks.length || !data.enemies.length) throw new Error('Unexpected dataset');
    localStorage.setItem(DATA_CACHE_KEY,JSON.stringify(data));
    setDataset(data,'Full dataset');
  }catch(err){
    if(!state.data.spells.length){
      setDataset(FALLBACK,'Fallback dataset');
      toast('Full dataset unavailable — using fallback list');
    }
  }
}
function setDataset(data,label){
  const previous=state.data.spells.length>0;
  state.data=data;
  const saved=loadSaved();
  for(const type of ['spells','perks','enemies']){
    const old=state.enabled[type]||{};
    state.enabled[type]={};
    for(const item of data[type]){
      state.enabled[type][item.id] = Object.prototype.hasOwnProperty.call(old,item.id) ? old[item.id] :
        (saved?.enabled?.[type] && Object.prototype.hasOwnProperty.call(saved.enabled[type],item.id) ? saved.enabled[type][item.id] : true);
    }
  }
  if(!previous && saved){
    state.customGroups=Array.isArray(saved.customGroups)?saved.customGroups:[];
    state.presets=saved.presets||{};
    for(const type of ['spells','perks','enemies']){
      const id=saved.current?.[type];
      state.current[type]=data[type].find(x=>x.id===id)||null;
    }
  }
  el('dataDot').classList.toggle('live',label!=='Fallback dataset');
  el('dataText').textContent=`${label} · ${data.spells.length} spells · ${data.perks.length} perks · ${data.enemies.length} enemies`;
  renderAll();
  save();
}
function items(type=state.tab){return state.data[type]||[]}
function enabledItems(type){return items(type).filter(x=>state.enabled[type][x.id])}
function secureIndex(n){
  if(n<=1) return 0;
  const max=0x100000000;
  const limit=max-(max%n);
  const a=new Uint32Array(1);
  do{crypto.getRandomValues(a)}while(a[0]>=limit);
  return a[0]%n;
}
function pick(type){
  const pool=enabledItems(type);
  return pool.length?pool[secureIndex(pool.length)]:null;
}
function iconCandidates(item){
  if(!item?.icon) return [];
  if(/^https?:\/\//i.test(item.icon)) return [item.icon];
  return ASSET_BASES.map(base=>base+item.icon);
}
function setImageWithFallback(img, urls){
  if(!urls.length){img.removeAttribute('src'); return}
  let idx=0;
  const tryNext=()=>{
    if(idx>=urls.length){
      img.removeAttribute('src');
      img.dataset.failed='1';
      img.onerror=null;
      return;
    }
    img.dataset.failed='';
    img.src=urls[idx++];
  };
  img.onerror=tryNext;
  tryNext();
}
function renderIconBox(host, item, title=''){
  host.innerHTML='';
  host.classList.toggle('placeholder', !item);
  if(!item) return;
  const img=document.createElement('img');
  img.alt=title || item.name || '';
  setImageWithFallback(img, iconCandidates(item));
  host.appendChild(img);
  host.classList.remove('placeholder');
}
function animateRoll(type){
  const pool=enabledItems(type);
  if(!pool.length){toast(`No ${type} enabled`);return Promise.resolve(null)}
  const key = type==='perks'?'perk':type==='spells'?'spell':'enemy';
  const valEl=el(key+'Value');
  const grpEl=el(key+'Group');
  const iconEl=el(key+'Icon');
  valEl.classList.add('spinning');
  return new Promise(resolve=>{
    let ticks=0;
    const total=13+secureIndex(7);
    const timer=setInterval(()=>{
      const temp=pool[secureIndex(pool.length)];
      valEl.textContent=temp.name; grpEl.textContent=temp.group;
      renderIconBox(iconEl,temp,temp.name);
      ticks++;
      if(ticks>=total){
        clearInterval(timer);
        const final=pick(type);
        state.current[type]=final;
        valEl.textContent=final.name; grpEl.textContent=final.group;
        renderIconBox(iconEl,final,final.name);
        valEl.classList.remove('spinning');
        save();
        renderProgressBoards();
        resolve(final);
      }
    },45+ticks*2);
  })
}
async function rollAll(){
  const types=['perks','spells','enemies'];
  if(types.some(t=>enabledItems(t).length===0)){toast('Each pool needs at least one enabled item');return}
  el('rollAll').disabled=true;
  await Promise.all(types.map((t,i)=>new Promise(res=>setTimeout(()=>animateRoll(t).then(res),i*85))));
  el('rollAll').disabled=false;
  updateCounts();
}
function groupNames(){
  if(state.tab!=='spells') return ['All'];
  return ['All',...new Set(items('spells').map(x=>x.group))];
}
function groupItems(group){
  return group==='All'?items():items().filter(x=>x.group===group);
}
function groupState(list,type=state.tab){
  if(!list.length)return 'off';
  const n=list.filter(x=>state.enabled[type][x.id]).length;
  return n===0?'off':n===list.length?'on':'partial';
}
function setMany(type,list,value){
  list.forEach(x=>state.enabled[type][x.id]=value);
  save(); renderAll();
}
function toggleGroup(type,list){
  const on=list.filter(x=>state.enabled[type][x.id]).length;
  setMany(type,list,on!==list.length);
}
function customForTab(){return state.customGroups.filter(g=>g.type===state.tab)}
function filteredItems(){
  let list=groupItems(state.selectedBuiltIn);
  const q=state.query.trim().toLowerCase();
  if(q) list=list.filter(x=>x.name.toLowerCase().includes(q)||x.id.toLowerCase().includes(q));
  return list;
}
function renderGroups(){
  const host=el('builtInGroups'); host.innerHTML='';
  const names=groupNames();
  if(!names.includes(state.selectedBuiltIn)) state.selectedBuiltIn='All';
  for(const name of names){
    const list=groupItems(name);
    const st=groupState(list);
    const n=list.filter(x=>state.enabled[state.tab][x.id]).length;
    const row=document.createElement('button');
    row.className='group-row'+(state.selectedBuiltIn===name?' selected':'');
    row.innerHTML=`<span class="group-check ${st}">${st==='on'?'✓':st==='partial'?'−':''}</span><span class="group-name">${esc(name)}</span><span class="group-num">${n}/${list.length}</span>`;
    row.addEventListener('click',e=>{
      if(e.shiftKey){toggleGroup(state.tab,list);return}
      state.selectedBuiltIn=name; renderAll();
    });
    row.addEventListener('dblclick',()=>toggleGroup(state.tab,list));
    row.title='Click to view. Shift-click or double-click to toggle the whole group.';
    host.appendChild(row);
  }
  const ch=el('customGroups'); ch.innerHTML='';
  const groups=customForTab();
  if(!groups.length){
    const d=document.createElement('div');d.style='color:var(--muted-2);font-size:11px;padding:4px 8px 8px';d.textContent='No custom groups';ch.appendChild(d);
  }
  for(const g of groups){
    const list=g.members.map(id=>items().find(x=>x.id===id)).filter(Boolean);
    const st=groupState(list);
    const n=list.filter(x=>state.enabled[state.tab][x.id]).length;
    const row=document.createElement('div');row.className='custom-group-row';
    row.innerHTML=`<span class="group-check ${st}">${st==='on'?'✓':st==='partial'?'−':''}</span>
      <button class="custom-toggle" title="Toggle all members"><span class="group-name">${esc(g.name)}</span><span class="group-num">${n}/${list.length}</span></button>
      <button class="mini-action edit" title="Edit">✎</button><button class="mini-action del" title="Delete">×</button>`;
    row.querySelector('.custom-toggle').addEventListener('click',()=>toggleGroup(state.tab,list));
    row.querySelector('.edit').addEventListener('click',()=>openGroupModal(g.id));
    row.querySelector('.del').addEventListener('click',()=>{
      if(confirm(`Delete custom group "${g.name}"?`)){
        state.customGroups=state.customGroups.filter(x=>x.id!==g.id);save();renderGroups();
      }
    });
    ch.appendChild(row);
  }
}
function renderItems(){
  const list=filteredItems();
  const host=el('items');host.innerHTML='';
  el('visibleCount').textContent=`${list.length} visible`;
  if(!list.length){host.innerHTML='<div class="empty">Nothing matches this filter.</div>';return}
  const frag=document.createDocumentFragment();
  for(const item of list){
    const row=document.createElement('div');row.className='item-row';
    const on=!!state.enabled[state.tab][item.id];
    row.innerHTML=`<button class="switch ${on?'on':''}" aria-label="${on?'Disable':'Enable'} ${esc(item.name)}"></button>
      <div class="item-icon placeholder"></div>
      <div><div class="item-name">${esc(item.name)}</div><div class="item-id">${esc(item.id)}</div></div>
      <span class="item-group">${esc(item.group)}</span>`;
    renderIconBox(row.querySelector('.item-icon'), item, item.name);
    row.querySelector('.switch').addEventListener('click',()=>{
      state.enabled[state.tab][item.id]=!state.enabled[state.tab][item.id];save();renderAll();
    });
    row.addEventListener('dblclick',e=>{
      if(e.target.closest('button'))return;
      state.enabled[state.tab][item.id]=!state.enabled[state.tab][item.id];save();renderAll();
    });
    frag.appendChild(row);
  }
  host.appendChild(frag);
}
function renderProgressGrid(type, hostId, metaId){
  const host=el(hostId); host.innerHTML='';
  const list=items(type);
  const currentId=state.current[type]?.id || null;
  const frag=document.createDocumentFragment();
  for(const item of list){
    const b=document.createElement('div');
    b.className='progress-icon'+(item.id===currentId?' selected':'')+(!item.icon?' missing':'');
    b.title=item.name;
    if(item.icon){
      const img=document.createElement('img');
      img.alt=item.name;
      img.loading='lazy';
      setImageWithFallback(img, iconCandidates(item));
      b.appendChild(img);
    }
    frag.appendChild(b);
  }
  host.appendChild(frag);
  el(metaId).textContent=`${list.length} shown · ${currentId ? '1 lit' : '0 lit'}`;
}
function renderProgressBoards(){
  renderProgressGrid('perks','perkProgressGrid','perkProgressMeta');
  renderProgressGrid('spells','spellProgressGrid','spellProgressMeta');
  renderProgressGrid('enemies','enemyProgressGrid','enemyProgressMeta');
}
function updateCounts(){
  const p=enabledItems('perks').length,s=enabledItems('spells').length,e=enabledItems('enemies').length;
  el('perkCount').textContent=`${p} enabled`;el('spellCount').textContent=`${s} enabled`;el('enemyCount').textContent=`${e} enabled`;
  el('statsLeft').textContent=`${p} perks · ${s} spells · ${e} enemies`;
  const combos=BigInt(p)*BigInt(s)*BigInt(e);
  el('statsRight').textContent=`${combos.toLocaleString()} possible combinations`;
  const map={perks:['perkValue','perkGroup','perkIcon'],spells:['spellValue','spellGroup','spellIcon'],enemies:['enemyValue','enemyGroup','enemyIcon']};
  for(const t of Object.keys(map)){
    const cur=state.current[t];
    if(cur){
      el(map[t][0]).textContent=cur.name;
      el(map[t][1]).textContent=cur.group;
      renderIconBox(el(map[t][2]), cur, cur.name);
    }else{
      renderIconBox(el(map[t][2]), null);
    }
  }
}
function renderPresets(){
  const sel=el('presetSelect'), old=sel.value;sel.innerHTML='<option value="">Presets…</option>';
  for(const name of Object.keys(state.presets).sort()){
    const o=document.createElement('option');o.value=name;o.textContent=name;sel.appendChild(o);
  }
  if(state.presets[old])sel.value=old;
}
function renderAll(){renderGroups();renderItems();updateCounts();renderPresets();renderProgressBoards()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function openGroupModal(editId=null){
  state.modal.editId=editId;
  const g=editId?state.customGroups.find(x=>x.id===editId):null;
  state.modal.members=new Set(g?.members||[]);
  el('groupName').value=g?.name||'';
  el('memberSearch').value='';
  el('modalTitle').textContent=g?'Edit custom group':`New ${state.tab.slice(0,-1)} group`;
  el('modalBackdrop').classList.add('open');
  renderMemberItems();
  setTimeout(()=>el('groupName').focus(),40);
}
function closeModal(){el('modalBackdrop').classList.remove('open')}
function modalFiltered(){
  const q=el('memberSearch').value.trim().toLowerCase();
  return items().filter(x=>!q||x.name.toLowerCase().includes(q)||x.id.toLowerCase().includes(q));
}
function renderMemberItems(){
  const list=modalFiltered(),host=el('memberItems');host.innerHTML='';
  const frag=document.createDocumentFragment();
  for(const item of list){
    const row=document.createElement('div');row.className='member-row';
    const on=state.modal.members.has(item.id);
    row.innerHTML=`<button class="checkbox ${on?'on':''}">${on?'✓':''}</button><div class="item-icon placeholder"></div><span class="item-name">${esc(item.name)}</span><span class="item-group">${esc(item.group)}</span>`;
    renderIconBox(row.querySelector('.item-icon'), item, item.name);
    row.querySelector('button').addEventListener('click',()=>{
      on?state.modal.members.delete(item.id):state.modal.members.add(item.id);renderMemberItems();
    });
    frag.appendChild(row);
  }
  host.appendChild(frag);
}
function saveGroup(){
  const name=el('groupName').value.trim();
  if(!name){toast('Give the group a name');return}
  const members=[...state.modal.members];
  if(state.modal.editId){
    const g=state.customGroups.find(x=>x.id===state.modal.editId);
    g.name=name;g.members=members;
  }else{
    state.customGroups.push({id:'g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),name,type:state.tab,members});
  }
  save();closeModal();renderAll();
}
function exportConfig(){
  const blob=new Blob([JSON.stringify({
    version:2,enabled:state.enabled,customGroups:state.customGroups,presets:state.presets
  },null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='noita-slot-machine-config.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function importConfig(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const x=JSON.parse(reader.result);
      if(!x || typeof x!=='object')throw 0;
      if(x.enabled) for(const t of ['spells','perks','enemies']){
        if(x.enabled[t]) for(const item of items(t)){
          if(Object.prototype.hasOwnProperty.call(x.enabled[t],item.id)) state.enabled[t][item.id]=!!x.enabled[t][item.id];
        }
      }
      if(Array.isArray(x.customGroups))state.customGroups=x.customGroups;
      if(x.presets && typeof x.presets==='object')state.presets=x.presets;
      save();renderAll();toast('Configuration imported');
    }catch{toast('That file is not a valid configuration')}
  };
  reader.readAsText(file);
}
function savePreset(){
  const name=prompt('Preset name:');
  if(!name?.trim())return;
  state.presets[name.trim()]={enabled:JSON.parse(JSON.stringify(state.enabled))};
  save();renderPresets();el('presetSelect').value=name.trim();toast('Preset saved');
}
function applyPreset(name){
  const p=state.presets[name];if(!p)return;
  for(const t of ['spells','perks','enemies']) for(const item of items(t)){
    if(p.enabled?.[t] && Object.prototype.hasOwnProperty.call(p.enabled[t],item.id)) state.enabled[t][item.id]=!!p.enabled[t][item.id];
  }
  save();renderAll();el('presetSelect').value=name;toast(`Loaded "${name}"`);
}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  state.tab=b.dataset.tab;state.selectedBuiltIn='All';state.query='';el('search').value='';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
  el('search').placeholder=`Search ${state.tab}…`;renderAll();
}));
el('search').addEventListener('input',e=>{state.query=e.target.value;renderItems()});
el('enableVisible').addEventListener('click',()=>setMany(state.tab,filteredItems(),true));
el('disableVisible').addEventListener('click',()=>setMany(state.tab,filteredItems(),false));
el('enableAll').addEventListener('click',()=>setMany(state.tab,items(),true));
el('disableAll').addEventListener('click',()=>setMany(state.tab,items(),false));
el('rollAll').addEventListener('click',rollAll);
document.querySelectorAll('[data-reroll]').forEach(b=>b.addEventListener('click',()=>animateRoll(b.dataset.reroll)));
el('newGroup').addEventListener('click',()=>openGroupModal());
el('closeModal').addEventListener('click',closeModal);el('cancelModal').addEventListener('click',closeModal);
el('modalBackdrop').addEventListener('click',e=>{if(e.target===el('modalBackdrop'))closeModal()});
el('memberSearch').addEventListener('input',renderMemberItems);
el('selectFiltered').addEventListener('click',()=>{modalFiltered().forEach(x=>state.modal.members.add(x.id));renderMemberItems()});
el('clearFiltered').addEventListener('click',()=>{modalFiltered().forEach(x=>state.modal.members.delete(x.id));renderMemberItems()});
el('saveGroup').addEventListener('click',saveGroup);
el('savePreset').addEventListener('click',savePreset);
el('presetSelect').addEventListener('change',e=>{if(e.target.value)applyPreset(e.target.value)});
el('deletePreset').addEventListener('click',()=>{
  const n=el('presetSelect').value;if(!n){toast('Choose a preset first');return}
  if(confirm(`Delete preset "${n}"?`)){delete state.presets[n];save();renderPresets();toast('Preset deleted')}
});
el('exportConfig').addEventListener('click',exportConfig);
el('importConfig').addEventListener('click',()=>el('importFile').click());
el('importFile').addEventListener('change',e=>{if(e.target.files[0])importConfig(e.target.files[0]);e.target.value=''});
el('resetApp').addEventListener('click',()=>{
  if(confirm('Reset all filters, custom groups, presets, and current rolls?')){
    localStorage.removeItem(STORAGE_KEY);
    state.customGroups=[];state.presets={};state.current={spells:null,perks:null,enemies:null};
    for(const t of ['spells','perks','enemies']) for(const item of items(t)) state.enabled[t][item.id]=true;
    save();renderAll();toast('Reset complete');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&el('modalBackdrop').classList.contains('open'))closeModal();
  if((e.key==='r'||e.key==='R')&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName) && !el('modalBackdrop').classList.contains('open')) rollAll();
});

loadDataset();
})();
</script>
