<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1d151c">
    <title>Watch Log</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Site tokens and reset, so this page follows the site's theme. -->
    <link rel="stylesheet" href="../../css/base.css">

    <style>
        .page {
            width: min(100% - var(--space-12), 880px);
            margin: 0 auto;
            padding: var(--space-12) 0 var(--space-24);
        }

        .title {
            font-family: var(--font-title);
            font-size: var(--text-tagline);
            font-weight: 800;
        }

        .heading {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--space-3) var(--space-6);
        }

        .heading__links {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-4);
        }

        .link {
            font-family: var(--font-display);
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            cursor: pointer;
            transition: color var(--duration-fast) var(--ease-out);
        }

        .link:hover {
            color: var(--color-accent);
        }

        .file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }

        .file-input:focus-visible + label {
            outline: 2px solid var(--color-accent);
        }

        .banner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-3);
            margin-top: var(--space-4);
            padding: var(--space-3) var(--space-4);
            font-size: var(--text-sm);
            color: var(--color-on-accent);
            background: var(--color-accent);
            border-radius: var(--radius-md);
        }

        .banner__reset {
            padding: var(--space-1) var(--space-3);
            font-family: var(--font-display);
            font-size: var(--text-xs);
            color: var(--color-on-accent);
            border: 1px solid currentcolor;
            border-radius: var(--radius-pill);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-3);
            margin: var(--space-6) 0 var(--space-4);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .chip {
            padding: var(--space-1) var(--space-4);
            font-family: var(--font-display);
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-pill);
            transition:
                color var(--duration-fast) var(--ease-out),
                border-color var(--duration-fast) var(--ease-out),
                background-color var(--duration-fast) var(--ease-out);
        }

        .chip:hover {
            color: var(--color-text);
            border-color: var(--color-border-strong);
        }

        .chip[aria-pressed="true"] {
            color: var(--color-on-accent);
            background: var(--color-accent);
            border-color: var(--color-accent);
        }

        .search {
            flex: 1 1 180px;
            max-width: 280px;
            margin-left: auto;
            padding: var(--space-2) var(--space-4);
            font: inherit;
            font-size: var(--text-sm);
            color: var(--color-text);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-pill);
        }

        .search::placeholder {
            color: var(--color-text-faint);
        }

        .count {
            font-family: var(--font-display);
            font-size: var(--text-sm);
            color: var(--color-text-faint);
        }

        /* Table ---------------------------------------------------------- */

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            padding: var(--space-2) var(--space-3);
            font-family: var(--font-display);
            font-size: var(--text-xs);
            font-weight: 500;
            text-align: left;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--color-text-faint);
            border-bottom: 1px solid var(--color-border);
        }

        .table th[data-sort] {
            cursor: pointer;
            user-select: none;
        }

        .table th[data-sort]:hover {
            color: var(--color-text);
        }

        .table th[aria-sort="ascending"]::after {
            content: " ↑";
            color: var(--color-accent);
        }

        .table th[aria-sort="descending"]::after {
            content: " ↓";
            color: var(--color-accent);
        }

        .row {
            transition: background-color var(--duration-fast) var(--ease-out);
        }

        .row--has-notes {
            cursor: pointer;
        }

        .row--has-notes:hover,
        .row--has-notes:focus-visible {
            background: var(--color-surface);
            outline: none;
        }

        .cell {
            padding: var(--space-3);
            border-bottom: 1px solid var(--color-border);
            vertical-align: middle;
        }

        .row[aria-expanded="true"] .cell {
            border-bottom-color: transparent;
        }

        .cell--rank {
            width: 2.5rem;
            font-family: var(--font-display);
            color: var(--color-text-faint);
        }

        .row__title {
            font-family: var(--font-title);
            font-size: var(--text-lg);
            font-weight: 800;
            line-height: 1.2;
        }

        .cell--type {
            width: 5rem;
        }

        .tag {
            padding: 0.1em var(--space-3);
            font-family: var(--font-display);
            font-size: var(--text-xs);
            color: var(--color-accent);
            background: var(--color-accent-soft);
            border-radius: var(--radius-pill);
        }

        .cell--rating {
            width: 9rem;
            white-space: nowrap;
        }

        .rating {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            font-family: var(--font-display);
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        .rating__number {
            min-width: 1.6em;
            color: var(--color-text);
        }

        /* Five rounded bars, each worth two points and filled left to right
           by the exact fraction, so 9 and 9.5 look different. */
        .bars {
            display: inline-flex;
            gap: 3px;
        }

        .bar {
            width: 16px;
            height: 8px;
            background: linear-gradient(
                90deg,
                var(--color-accent) var(--fill, 0%),
                var(--color-border-strong) var(--fill, 0%)
            );
            border-radius: 4px;
        }

        .cell--notes {
            width: 1.5rem;
            font-size: var(--text-lg);
            color: var(--color-text-faint);
            text-align: right;
            transition: transform var(--duration-base) var(--ease-bounce);
        }

        .row[aria-expanded="true"] .cell--notes {
            transform: rotate(90deg);
            color: var(--color-accent);
        }

        .notes td {
            padding: 0 var(--space-3) var(--space-4) calc(2.5rem + var(--space-3) * 2);
            border-bottom: 1px solid var(--color-border);
        }

        .notes__text {
            max-width: 60ch;
            color: var(--color-text-muted);
        }

        @media (max-width: 640px) {
            .page {
                width: min(100% - var(--space-8), 880px);
            }

            .search {
                max-width: none;
                margin-left: 0;
            }

            .cell--type {
                display: none;
            }

            .table th:nth-child(3) {
                display: none;
            }

            .cell--rating {
                width: auto;
            }

            .bars {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="heading">
            <h1 class="title">Watch Log</h1>
            <nav class="heading__links" aria-label="Your own list">
                <a class="link" href="../list-editor/">Make your own &rarr;</a>
                <input class="file-input" id="import-file" type="file" accept=".txt,.json,.csv,text/plain,application/json,text/csv">
                <label class="link" for="import-file">Use your own list</label>
            </nav>
        </div>

        <p class="banner" id="banner" hidden>
            Showing your list, kept only in this browser.
            <button class="banner__reset" id="reset" type="button">Show the original</button>
        </p>

        <div class="toolbar">
            <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
            <input class="search" id="search" type="search" placeholder="Search" aria-label="Search titles and notes">
            <p class="count" id="count" aria-live="polite"></p>
        </div>

        <table class="table" id="table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col" data-sort="title" aria-sort="none">Title</th>
                    <th scope="col" data-sort="type" aria-sort="none">Type</th>
                    <th scope="col" data-sort="rating" aria-sort="descending">Rating</th>
                    <th scope="col" aria-label="Notes"></th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </main>

    <script src="app.js" type="module"></script>
    <!-- Adds the "back to the menu" bar at the top of the page. -->
    <script src="../../js/return-home.js" defer></script>
</body>
</html>
